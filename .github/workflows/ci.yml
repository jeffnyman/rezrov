# Build and test on every pull request and on pushes to main.
#
# The checkout deliberately does not fetch submodules. Entharion is about
# 230 MB and holds specifications, story files, and reference interpreters
# that are useful during development but that nothing in the build or the
# test suite depends on. The tests construct their inputs by hand for
# exactly this reason.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The job keys below become the status check contexts. A matrix job gets
  # its matrix values appended, so this produces `build`, and then
  # `test (ubuntu-latest)`, `test (windows-latest)`, and
  # `test (macos-latest)`. Those names are what the Protect Main ruleset
  # requires, so renaming a job here means updating the ruleset too.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # ContinuousIntegrationBuild turns warnings into errors, per the
      # condition in Directory.Build.props, and normalizes embedded source
      # paths so the output is deterministic. Because EnforceCodeStyleInBuild
      # is also on, .editorconfig violations fail here rather than needing a
      # separate formatting job.
      - run: dotnet build -p:ContinuousIntegrationBuild=true

  # The graphical program is the one that cannot be published as a
  # single file: Skia and HarfBuzz are native libraries that sit beside
  # it, so it publishes as a directory, and that publish is the part of
  # a release which an ordinary build does not exercise at all. Doing it
  # here means a platform where it cannot be built is found on a pull
  # request rather than on a tag, when the release is already half made.
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The Linux runners have clang but not always the zlib headers the
      # native linker wants.
      - name: Install the Linux linker prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - name: Publish the graphical program
        shell: bash
        run: dotnet publish src/Rezrov.Gui -c Release -r ${{ matrix.rid }} -p:ContinuousIntegrationBuild=true -o out/gui

      # The executable and the two native libraries beside it are what
      # the archive carries, so their absence is exactly what would
      # break a release.
      - name: Check that the archive would have what it needs
        shell: bash
        run: |
          cd out/gui
          ls -la
          missing=0
          for name in rezrov-gui libSkiaSharp libHarfBuzzSharp; do
            if ! ls "${name}"* > /dev/null 2>&1; then
              echo "The publish has no ${name}." >&2
              missing=1
            fi
          done
          exit "$missing"

      # A window needs a display and a runner has none, but the font
      # measuring does not, and it is what the whole layout is built on.
      - name: Measure the fonts
        if: runner.os == 'Windows'
        shell: bash
        run: out/gui/rezrov-gui.exe --probe

  test:
    strategy:
      # Run every platform even after one fails. Knowing that a failure is
      # Windows-only, rather than universal, is most of the diagnosis.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet test -p:ContinuousIntegrationBuild=true
